spring:
  application:
    name: stelsey-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/stelsey
    username: ${DB_USER:stelsey}
    password: ${DB_PASSWORD:stelsey}
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
logging:
  level:
    org.hibernate.SQL: debug
app:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    display-name: ${ADMIN_NAME:Admin}