spring:
  application:
    name: stelsey-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/stelsey
    username: ${DB_USER:stelsey}
    password: ${DB_PASSWORD:stelsey}
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
logging:
  level:
    org.hibernate.SQL: debug
app:
  invites:
    base-url: ${APP_BASE_URL:http://localhost:3000}
    ttl: 7d
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    display-name: ${ADMIN_NAME:Admin}
server:
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}